[package]
name = "brust-bam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "BAM and BGZF reader, writer, and SAM conversion helpers for Brust."
keywords = ["bioinformatics", "bam", "bgzf", "alignment", "genomics"]
categories = ["science::bioinformatics", "science::bioinformatics::genomics", "parser-implementations", "compression"]

[dependencies]
brust-core = { path = "../brust-core", version = "0.3.0" }
flate2 = "1.1.9"
sam = { package = "brust-sam", path = "../sam", version = "0.3.0" }
seq = { package = "brust-seq", path = "../seq", version = "0.3.0" }
