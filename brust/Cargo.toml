[package]
name = "brust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Public facade for Brust bioinformatics format readers, writers, and conversion helpers."
keywords = ["bioinformatics", "fasta", "fastq", "bam", "pod5"]
categories = ["science::bioinformatics", "science::bioinformatics::genomics", "command-line-utilities", "parser-implementations"]

[dependencies]
brust-core = { path = "../brust-core", version = "0.4.0" }
fasta = { package = "brust-fasta", path = "../fasta", version = "0.4.0" }
sam = { package = "brust-sam", path = "../sam", version = "0.4.0" }
bam = { package = "brust-bam", path = "../bam", version = "0.4.0" }
fastq = { package = "brust-fastq", path = "../fastq", version = "0.4.0" }
pod5 = { package = "brust-pod5", path = "../pod5", version = "0.4.0" }
seq = { package = "brust-seq", path = "../seq", version = "0.4.0" }
clap = { version = "4.6.1", features = ["derive"] }
