[package]
name = "brust-pod5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "POD5 reader, writer, signal extraction, and metadata summaries for Brust."
keywords = ["bioinformatics", "pod5", "nanopore", "arrow", "signal"]
