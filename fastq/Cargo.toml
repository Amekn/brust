[package]
name = "brust-fastq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "FASTQ reader, writer, and FASTA conversion helpers for Brust."
keywords = ["bioinformatics", "fastq", "sequencing", "phred", "gzip"]
categories = ["science::bioinformatics", "science::bioinformatics::sequence-analysis", "parser-implementations"]

[dependencies]
brust-core = { path = "../brust-core", version = "0.3.1" }
fasta = { package = "brust-fasta", path = "../fasta", version = "0.3.1" }
flate2 = "1.1.9"
